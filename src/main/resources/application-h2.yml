spring:
  config:
    activate:
      on-profile: h2
  datasource:
    # LOCK_TIMEOUT=10000: 50 luồng xếp hàng chờ khóa dòng (~40ms/luồng) cần > 1s mặc định của H2
    url: jdbc:h2:mem:ecommerce_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.r2s.masterclass: DEBUG
