version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Database Service: PostgreSQL 16 Alpine with Healthcheck
  # --------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: r2s-postgres-student
    restart: always
    environment:
      POSTGRES_DB: ecommerce_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_student_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - r2s-student-network

  # --------------------------------------------------------------------------
  # Application Service (Task 4): chỉ chạy khi bật profile "app"
  #   docker compose --profile app up -d --build
  # --------------------------------------------------------------------------
  app:
    profiles: ["app"]
    build: .
    image: r2s-order-service:v1
    container_name: r2s-order-service
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ecommerce_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    networks:
      - r2s-student-network

networks:
  r2s-student-network:
    driver: bridge

volumes:
  postgres_student_data:
    driver: local
